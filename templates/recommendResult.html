<!DOCTYPE html>
<html lang="hu" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recommended Drinks</title>
    <link rel="stylesheet" href="/css/styles.css" />

</head>
<body>
<header>
    <img src="/images/IbolyAppLogo.png" alt="ibolyApp Logo" />
    <form action="/recommend/recommendForm" method="get">
        <button type="submit">Vissza</button>
    </form>
<!--    <a href="/recommend/recommendForm"><button>Vissza</button></a>-->
</header>
<div class="card-container">
    <div class="card">
        <h3>Első variáció</h3>
        <button class="star-button">
            <img src="/images/star.svg" alt="Favorite" />
        </button>
        <ul>
            <li th:each="drink : ${recommendedDrinks1}">
                <span th:text="${drink.name}"></span> -
                <span th:text="${drink.price}">Price</span> HUF -
                <span th:text="${drink.alcoholContent}">Alcohol Content</span>%
            </li>
        </ul>
    </div>
    <div class="card">
        <h3>Második variáció</h3>
        <button class="star-button">
            <img src="/images/star.svg" alt="Favorite" />
        </button>
        <ul>
            <li th:each="drink : ${recommendedDrinks2}">
                <span th:text="${drink.name}"></span> -
                <span th:text="${drink.price}">Price</span> HUF -
                <span th:text="${drink.alcoholContent}">Alcohol Content</span>%
            </li>
        </ul>
    </div>
    <div class="card">
        <h3>Harmadik variáció</h3>
        <button class="star-button">
            <img src="/images/star.svg" alt="Favorite" />
        </button>
        <ul>
            <li th:each="drink : ${recommendedDrinks3}">
                <span th:text="${drink.name}"></span> -
                <span th:text="${drink.price}">Price</span> HUF -
                <span th:text="${drink.alcoholContent}">Alcohol Content</span>%
            </li>
        </ul>
    </div>
</div>
<a href="/favorites"> a</a>
<form action="/favorites/favorites" method="post">
    <button type="submit">DrinkList</button>
</form>

<script> //backend-el majd valahogy hozzáadod a kedvencekhez
    document.addEventListener("DOMContentLoaded", function() {
        const starButtons = document.querySelectorAll(".star-button");

        starButtons.forEach(button => {
            button.addEventListener("click", function() {
                // Toggle the "active" class
                this.classList.toggle("active");
                // Change the image source based on the active class
                const img = this.querySelector("img");
                if (this.classList.contains("active")) {
                    img.src = "/images/star-filled.svg"; // Path to the yellow star image
                } else {
                    img.src = "/images/star.svg"; // Path to the grey star image
                }
            });
        });
    });
</script>
</body>
</html>
