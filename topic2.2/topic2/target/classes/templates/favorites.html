<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Favorites</title>
</head>
<body>
<h1>Favorite Drinks</h1>
<ul>
    <li th:each="favorite : ${favoriteDrinks}">
        <span th:text="${favorite.drink.name}"></span> -
        <span th:text="${favorite.drink.price}"></span>
    </li>
</ul>
</body>
</html>
