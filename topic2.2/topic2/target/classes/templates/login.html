<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f0f0;
        }
        .login-container {
            padding: 20px;
            background: white;
            border: 1px solid #ddd;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 300px;
            text-align: center;
        }
        label, input {
            display: block;
            margin: 5px 0;
            width: 100%;
        }
        input[type="submit"], button {
            margin-top: 10px;
            padding: 10px;
            width: 100%;
            background-color: #007bff;
            color: white;
            border: none;
            cursor: pointer;
        }
        input[type="submit"]:hover, button:hover {
            background-color: #0056b3;
        }
        .register-button {
            background-color: #6c757d;
        }
        .register-button:hover {
            background-color: #5a6268;
        }
    </style>
</head>
<body>

<div class="login-container">
    <h2>Login</h2>
    <form id="loginForm" action="/login" method="post">
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required>

        <input type="submit" value="Login">
    </form>
    <form action="/register" method="get">
        <button type="submit">Back</button>
</div>

<script>
    // Redirect to /register page
    function redirectToRegister() {
        //window.location.href = "/register";
    }

    // Handle form submission
    document.getElementById("loginForm").addEventListener("submit", function(event) {
        event.preventDefault();

        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;
        const loginData = JSON.stringify({ email: email, password: password });

        fetch("/login", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: loginData
        })
        .then(response => {
            if (response.ok) {
                alert("Login successful! Redirecting to recommendForm.");
                window.location.href = "/recommend/recommendForm"; // Redirect to a dashboard or home page after login
            } else {
                alert("Login failed. Please check your credentials.");
            }
        })
        .catch(error => {
            alert("An error occurred during login.");
            console.error("Error:", error);
        });
    });
</script>

</body>
</html>
