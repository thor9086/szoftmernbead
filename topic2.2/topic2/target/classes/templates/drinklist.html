<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Itallista</title>
    <link rel="stylesheet" href="/css/styles.css" />
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e1e30 25%, #2e2e42 25%, #2e2e42 50%, #1e1e30 50%, #1e1e30 75%, #2e2e42 75%);
            background-size: 40px 40px;
            margin: 0;
            padding: 0;
            color: #f5f5f5;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(90deg, #ff6f3c, #ff4e00);
            color: white;
            padding: 15px 30px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }
        /*header img {*/
        /*    height: 60px;*/
        /*}*/
        header button {
            background-color: #262640;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
            transition: background-color 0.3s;
        }
        header button:hover {
            background-color: #171b2c;
        }
        h1, h2 {
            text-align: center;
            margin: 20px;
            color: #ff6f3c;
        }
        .drink-category {
            width: 80%;
            margin: 20px auto;
            background-color: #262640;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            overflow: hidden;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .drink-category:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.5);
        }
        .drink-category-header {
            background-color: #ff4e00;
            color: white;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
        }
        .drink-list {
            padding: 15px;
        }
        .drink-list-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #3a3a58;
            font-size: 1.5rem;
        }
        .drink-list-row:last-child {
            border-bottom: none;
        }
        .drink-name {
            /*font-size: 16px;*/
            color: #f5f5f5;
        }
        .drink-info {
            /*font-size: 14px;*/
            color: #c2c2d6;
        }
        footer {
            text-align: center;
            padding: 15px;
            background-color: #ff6f3c;
            color: white;
            margin-top: auto;
            border-top: 5px solid #ff4e00;
        }
        @media (max-width: 600px) {
            .drink-list-row {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>
<header>
    <img src="/images/IbolyAppLogo.png" alt="IbolyApp Logo" />
<!--    <form action="recommendForm.html" method="get">-->
<!--        <button type="submit">Vissza</button>-->
<!--    </form>-->
    <a href="/recommend/recommendForm"><button type="submit">Vissza</button></a>
</header>

<h2>Elérhető italok:</h2>

<div class="drink-category">
    <div class="drink-category-header">Sör/Cider</div>
    <div class="drink-list">
        <th:block th:each="drink: ${beerCider}">
            <div class="drink-list-row">
                <span class="drink-name" th:text="${drink.name}">Név</span>
                <span class="drink-info">Alkoholtartalom: <span th:text="${drink.alcoholContent + ' %'}"></span></span>
                <span class="drink-info">Ár: <span th:text="${drink.price + ' HUF'}"></span></span>
            </div>
        </th:block>
    </div>
</div>

<div class="drink-category">
    <div class="drink-category-header">Hosszú Italok</div>
    <div class="drink-list">
        <th:block th:each="drink: ${cocktails}">
            <div class="drink-list-row">
                <span class="drink-name" th:text="${drink.name}">Név</span>
                <span class="drink-info">Alkoholtartalom: <span th:text="${drink.alcoholContent + ' %'}"></span></span>
                <span class="drink-info">Ár: <span th:text="${drink.price + ' HUF'}"></span></span>
            </div>
        </th:block>
    </div>
</div>

<div class="drink-category">
    <div class="drink-category-header">Likőr</div>
    <div class="drink-list">
        <th:block th:each="drink: ${liquors}">
            <div class="drink-list-row">
                <span class="drink-name" th:text="${drink.name}">Név</span>
                <span class="drink-info">Alkoholtartalom: <span th:text="${drink.alcoholContent + ' %'}"></span></span>
                <span class="drink-info">Ár: <span th:text="${drink.price + ' HUF'}"></span></span>
            </div>
        </th:block>
    </div>
</div>

<footer>
    <p>&copy; 2024 IbolyaRémei - Minden jog fenntartva.</p>
</footer>
</body>
</html>
