<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Itallista</title>
    <link rel="stylesheet" href="/css/styles.css" />
    <style>
        .drink-table {
            width: 80%;
            margin: auto;
            border-collapse: collapse;
            background-color: white;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        .drink-table th, .drink-table td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        .drink-table th {
            background-color: rgb(23, 27, 44);
            color: white;
        }
        .drink-table tr:hover {
            background-color: #f5f5f5;
        }
        .drink-table td {
            color: rgb(23, 27, 44);
        }
    </style>
</head>
<body>
<header>
    <img src="/images/IbolyAppLogo.png" alt="ibolyApp Logo" />
    <form action="recommendForm.html" method="get">
        <button type="submit">Vissza</button>
    </form>
</header>
<h1>Üdvözöllek, <span th:text="${user}">Felhasználó</span>!</h1>
<h2>Elérhető italok:</h2>

<h3>Sör/Cider</h3>
<table class="drink-table">
    <thead>
    <tr>
        <th>Név</th>
        <th>Alkoholtartalom</th>
        <th>Ár</th>
    </tr>
    </thead>
    <tbody>
    <th:block th:each="drink: ${beerCider}">
        <tr>
            <td th:text="${drink.name}">Név</td>
            <td th:text="${drink.alcoholContent + ' %'}">Alkoholtartalom</td>
            <td th:text="${drink.price + ' HUF'}">Ár</td>
        </tr>
    </th:block>
    </tbody>
</table>

<h3>Koktél</h3>
<table class="drink-table">
    <thead>
    <tr>
        <th>Név</th>
        <th>Alkoholtartalom</th>
        <th>Ár</th>
    </tr>
    </thead>
    <tbody>
    <th:block th:each="drink: ${cocktails}">
        <tr>
            <td th:text="${drink.name}">Név</td>
            <td th:text="${drink.alcoholContent + ' %'}">Alkoholtartalom</td>
            <td th:text="${drink.price + ' HUF'}">Ár</td>
        </tr>
    </th:block>
    </tbody>
</table>

<h3>Likőr</h3>
<table class="drink-table">
    <thead>
    <tr>
        <th>Név</th>
        <th>Alkoholtartalom</th>
        <th>Ár</th>
    </tr>
    </thead>
    <tbody>
    <th:block th:each="drink: ${liquors}">
        <tr>
            <td th:text="${drink.name}">Név</td>
            <td th:text="${drink.alcoholContent + ' %'}">Alkoholtartalom</td>
            <td th:text="${drink.price + ' HUF'}">Ár</td>
        </tr>
    </th:block>
    </tbody>
</table>

</body>
</html>
