<!DOCTYPE html>
<html lang="hu" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recommended Packages</title>
    <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
<header>
    <img src="/images/IbolyAppLogo.png" alt="ibolyApp Logo" />
    <form action="/recommend/recommendForm" method="get">
        <button type="submit">Back</button>
    </form>
</header>
<div class="card-container">
    <div class="card">
        <h3>Első variáció</h3>
        <ul>
            <li th:each="drink : ${recommendedDrinks1}">
                <span th:text="${drink.name}"></span> -
                <span th:text="${drink.price}">Price</span> HUF -
                <span th:text="${drink.alcoholContent}">Alcohol Content</span>%
            </li>
        </ul>
        <button class="package-button" th:attr="data-package-id=${package1.id}">
            Add to Favourites
        </button>
    </div>
    <div class="card">
        <h3>Második variáció</h3>
        <ul>
            <li th:each="drink : ${recommendedDrinks2}">
                <span th:text="${drink.name}"></span> -
                <span th:text="${drink.price}">Price</span> HUF -
                <span th:text="${drink.alcoholContent}">Alcohol Content</span>%
            </li>
        </ul>
        <button class="package-button" th:attr="data-package-id=${package2.id}">
            Add to Favourites
        </button>
    </div>
    <div class="card">
        <h3>Harmadik variáció</h3>
        <ul>
            <li th:each="drink : ${recommendedDrinks3}">
                <span th:text="${drink.name}"></span> -
                <span th:text="${drink.price}">Price</span> HUF -
                <span th:text="${drink.alcoholContent}">Alcohol Content</span>%
            </li>
        </ul>
        <button class="package-button" th:attr="data-package-id=${package3.id}">
            Add to Favourites
        </button>
    </div>
</div>

<a th:href="@{/list/drinklist}">Nézd meg az ital lapot.</a>
<a th:href="@{/favourite/list}">Nézd meg a kedvenceid.</a>

<script>
    document.querySelectorAll('.package-button').forEach(button => {
        button.addEventListener('click', function() {
            const packageId = this.getAttribute('data-package-id');

            fetch('/favourite/add', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ packageId: packageId })
            })
            .then(response => {
                if (response.ok) {
                    alert('Package added to favourites!');
                } else {
                    response.text().then(errorMessage => alert(errorMessage));
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('An error occurred. Please try again.');
            });
        });
    });
</script>

</body>
</html>
