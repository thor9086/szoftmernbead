<!DOCTYPE html>
<html lang="hu" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recommended Drinks</title>
    <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
<header>
    <img src="/images/IbolyAppLogo.png" alt="ibolyApp Logo" />
    <form action="/recommend/recommendForm" method="get">
        <button type="submit">Back</button>
    </form>
</header>
<div class="card-container">
    <div class="card">
        <h3>Első variáció</h3>
        <form class="favourite-form" th:action="@{/favourite/add}" method="post">
            <!-- DrinkPackage ID -->
            <input type="hidden" th:value="${package1.id}" name="packageId" />
            <button type="button" class="star-button">
                <img src="/images/star.svg" alt="Favorite" />
            </button>
        </form>
        <ul>
            <li th:each="drink : ${recommendedDrinks1}">
                <span th:text="${drink.name}"></span> -
                <span th:text="${drink.price}">Price</span> HUF -
                <span th:text="${drink.alcoholContent}">Alcohol Content</span>%
            </li>
        </ul>
    </div>
    <div class="card">
        <h3>Második variáció</h3>
        <form class="favourite-form" th:action="@{/favourite/add}" method="post">
            <input type="hidden" th:value="${package2.id}" name="packageId" />
            <button type="button" class="star-button">
                <img src="/images/star.svg" alt="Favorite" />
            </button>
        </form>
        <ul>
            <li th:each="drink : ${recommendedDrinks2}">
                <span th:text="${drink.name}"></span> -
                <span th:text="${drink.price}">Price</span> HUF -
                <span th:text="${drink.alcoholContent}">Alcohol Content</span>%
            </li>
        </ul>
    </div>
    <div class="card">
        <h3>Harmadik variáció</h3>
        <form class="favourite-form" th:action="@{/favourite/add}" method="post">
            <input type="hidden" th:value="${package3.id}" name="packageId" />
            <button type="button" class="star-button">
                <img src="/images/star.svg" alt="Favorite" />
            </button>
        </form>
        <ul>
            <li th:each="drink : ${recommendedDrinks3}">
                <span th:text="${drink.name}"></span> -
                <span th:text="${drink.price}">Price</span> HUF -
                <span th:text="${drink.alcoholContent}">Alcohol Content</span>%
            </li>
        </ul>
    </div>
</div>


<a th:href="@{/list/drinklist}">Nézd meg az ital lapot.</a>

<a th:href="@{/favourite/list}">Nézd meg a kedvenceid.</a>
<script>
    document.addEventListener("DOMContentLoaded", function() {
        const starButtons = document.querySelectorAll(".star-button");

        starButtons.forEach(button => {
            button.addEventListener("click", function(event) {
                event.preventDefault();
                const form = this.closest(".favourite-form");
                const packageId = form.querySelector("input[name='packageId']").value;
                const isActive = this.classList.contains("active");
                const endpoint = isActive ? "/favourite/remove" : "/favourite/add";

                fetch(endpoint, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/x-www-form-urlencoded"
                    },
                    body: `packageId=${packageId}`
                })
                    .then(response => response.json())
                    .then(data => {
                        if (data.success) {
                            this.classList.toggle("active");
                            const img = this.querySelector("img");
                            if (this.classList.contains("active")) {
                                img.src = "/images/star-filled.svg";
                            } else {
                                img.src = "/images/star.svg";
                            }
                            const message = isActive ? "Eltávolítva a kedvencekből!" : "Hozzáadva a kedvencekhez!";
                            alert(message);
                        } else {
                            alert("Something went wrong!");
                        }
                    })
                    .catch(error => console.error("Error:", error));
            });
        });
    });
</script>
</body>
</html>
