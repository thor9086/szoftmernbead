<!DOCTYPE html>
<html lang="hu" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Drink List</title>

</head>
<body>
<h1>Welcome, <span th:text="${user}">User</span>!</h1>
<h2>Available Drinks</h2>
<ul>
    <!-- Iterálás az italok listáján -->
    <li th:each="drink : ${allDrinks}" th:text="${drink.name}">Drink Name</li>
</ul>
</body>
</html>
