<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Favorites</title>
    <link rel="stylesheet" href="/css/styles.css" />
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e1e30 25%, #2e2e42 25%, #2e2e42 50%, #1e1e30 50%, #1e1e30 75%, #2e2e42 75%);
            background-size: 40px 40px;
            margin: 0;
            padding: 0;
            color: #f5f5f5;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(90deg, #ff6f3c, #ff4e00);
            color: white;
            padding: 15px 30px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }
        header img {
            height: 60px;
        }
        header button {
            background-color: #ff6f3c;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
            transition: background-color 0.3s;
        }
        header button:hover {
            background-color: #ff4e00;
        }
        h1 {
            text-align: center;
            margin: 20px;
            color: #ff6f3c;
        }
        .card-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            padding: 20px;
        }
        .card {
            background-color: #262640;
            width: 300px;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.5);
        }
        .card h3 {
            margin-top: 0;
            color: #ff6f3c;
        }
        .card p {
            margin: 10px 0;
            color: #f5f5f5;
        }
        footer {
            text-align: center;
            padding: 15px;
            background-color: #ff6f3c;
            color: white;
            margin-top: 50px;
            border-top: 5px solid #ff4e00;
        }
    </style>
</head>
<body>
<header>
    <img src="/images/IbolyAppLogo.png" alt="ibolyApp Logo" />
    <form th:action="/recommend/recommendForm" method="get">
        <button type="submit">Vissza</button>
    </form>
</header>
<h1>Favorite Drinks</h1>
<div th:if="${favouriteDrinks.empty}">
    <p style="text-align: center; color: #c2c2d6;">You have no favourite drinks yet.</p>
</div>
<div class="card-container">
    <div th:each="favorite : ${favoriteDrinks}" class="card">
        <h3 th:text="${favorite.drink.name}">Drink Name</h3>
        <p>Price: <span th:text="${favorite.drink.price}">Price</span> HUF</p>
        <p>Alcohol Content: <span th:text="${favorite.drink.alcoholContent}">Alcohol Content</span>%</p>
    </div>
</div>
<footer>
    <p>&copy; 2024 IbolyaRémei. Minden jog fenntartva.</p>
</footer>
</body>
</html>
