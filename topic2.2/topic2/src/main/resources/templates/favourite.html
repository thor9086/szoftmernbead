<!DOCTYPE html>
<html lang="hu" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Drink Packages</title>
</head>
<body>
<h1>Drink Packages for User</h1>
<div>
    <ul>
        <!-- Iterálás a drinkPackages listán -->
        <th:block th:each="drinkPackage : ${drinkPackages}">
            <h2>Package ID: <span th:text="${drinkPackage.id}"></span></h2>
            <ul>
                <!-- Iterálás az italok listáján, amelyek a drinkPackage-ban vannak -->
                <th:block th:each="drink : ${drinkPackage.drinks}">
                    <li>
                        <p>Name: <span th:text="${drink.name}"></span></p>
                        <p>Price: <span th:text="${drink.price}"></span></p>
                        <p>Alcohol Content: <span th:text="${drink.alcoholContent}"></span>%</p>
                        <p>Volume: <span th:text="${drink.volume}"></span> ml</p>
                    </li>
                </th:block>
            </ul>
        </th:block>
    </ul>
</div>
</body>
</html>
