<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
<header>
    <img src="/images/IbolyAppLogo.png" alt="ibolyApp Logo" />
    <a href="/login"><button>Bejelentkezés</button></a>
</header>
<div class="register-container">
    <h2>Register</h2>
    <form id="registerForm" action="/register" method="post">
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required>

        <input type="submit" value="Register">
    </form>
    <form action="/login" method="get">
        <button type="submit" class="login-container">Go to login</button>
    </form>
</div>

<script>
    // Redirect to /login page
    function redirectToLogin() {
        //window.location.href = "/login";
    }

    // Handle form submission
    document.getElementById("registerForm").addEventListener("submit", function(event) {
        event.preventDefault();

        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;
        const userData = JSON.stringify({ email: email, password: password });

        fetch("/register", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: userData
        })
        .then(response => {
            if (response.ok) {
                alert("Registration successful! Redirecting to login page.");
                window.location.href = "/login"; // Redirect to /login after successful registration
            } else {
                alert("Registration failed. Please try again.");
            }
        })
        .catch(error => {
            alert("An error occurred during registration.");
            console.error("Error:", error);
        });
    });
</script>

</body>
</html>
